# samo-proxy + cloudflared: the whole internet edge, on a box that is NOT
# behind the VPN.
#
# The point of running these here rather than on the samo box is the samo box's
# ProtonVPN kill-switch. With `ufw default deny outgoing` and the VPN as the
# default route, cloudflared's connection to Cloudflare's edge is a tunnel
# inside a tunnel — it inherits the VPN's congestion, its MTU, and its
# throughput ceiling. Moving cloudflared to a machine whose default route is the
# plain WAN removes all of that, and samo-server keeps its kill-switch intact.
#
# Both containers use host networking, and samo-proxy binds loopback. That is
# what makes the trust model simple: cloudflared reaches it on 127.0.0.1:6767
# and nothing else on the network can reach it at all, so the only source of
# CF-Connecting-IP is the one process allowed to set it.
#
# Host networking is also what lets samo-proxy find samo-server by itself. LAN
# discovery is a UDP broadcast, and a container on Docker's default bridge
# cannot send one — the same constraint that makes samo-server run this way.

services:
  samo-proxy:
    image: ghcr.io/bouliehaan/samo-proxy:latest
    container_name: samo-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      # Loopback: cloudflared is on the same host stack and reaches it here,
      # and nothing on the LAN can. The egress listener is the one thing that
      # binds outward, and it has a different trust model — it believes no
      # headers at all, requires a shared secret, and only connects to
      # allow-listed hosts. It stays off unless SAMOPROXY_EGRESS_TOKEN is set.
      SAMOPROXY_ADDR: "127.0.0.1:6767"

      # Left empty on purpose: samo-proxy asks the LAN which samo-server to use,
      # the same way the Android and desktop clients do. Set it only if your
      # server is somewhere a broadcast cannot describe.
      SAMOPROXY_ORIGIN: "${SAMOPROXY_ORIGIN:-}"

      # cloudflared terminates TLS at Cloudflare's edge and forwards plain
      # HTTP, so samo-server cannot work the real scheme out for itself.
      # publicURL() builds absolute URLs from this and security_headers.go
      # gates HSTS on it.
      SAMOPROXY_FORWARDED_PROTO: "https"

      # Whose CF-Connecting-IP we believe. This is the security-critical knob:
      # samo-server's login limiter keys its brute-force lockout on that header,
      # so anything allowed to set it gets an unlimited supply of rate-limit
      # buckets. Loopback means cloudflared and nothing else — strictly tighter
      # than the compose subnet this used to name, which was every container on
      # the host.
      SAMOPROXY_TRUST_FORWARDED_FROM: "${SAMOPROXY_TRUST_FORWARDED_FROM:-127.0.0.0/8,::1/128}"

      # Lossless in, Opus out. A 24/96 FLAC is ~4.5 Mbps sustained; 128k Opus
      # is transparent enough for streaming and ~35x smaller.
      SAMOPROXY_TRANSCODE: "true"
      SAMOPROXY_TRANSCODE_CODEC: "opus"
      SAMOPROXY_TRANSCODE_BITRATE: "128"
      # Lossy sources pass through untouched. Re-encoding a 192k MP3 is an
      # audible loss for a much smaller saving.
      SAMOPROXY_TRANSCODE_LOSSY: "false"

      # The Android client never sends a width, so every grid tile pulls the
      # full embedded cover. 768 is a real rung on samo-server's ladder.
      SAMOPROXY_IMAGE_DEFAULT_WIDTH: "768"

      SAMOPROXY_CACHE_DIR: "/var/cache/samo-proxy"
      SAMOPROXY_CACHE_MAX_MB: "${SAMOPROXY_CACHE_MAX_MB:-16384}"

      # --- outbound egress, off unless SAMOPROXY_EGRESS_TOKEN is set ---------
      #
      # A CONNECT proxy the samo box can use to reach the few hosts that refuse
      # its VPN exit address. Deezer's image CDN is the case that forced it:
      # api.deezer.com answers the samo box normally, cdn-images.dzcdn.net
      # answers every one of its requests with 403, so the artist photo
      # backfill finds a picture per artist and downloads none of them.
      #
      # This is a hole in the VPN and it is meant to be a very small one. Only
      # allow-listed hosts, only CONNECT, only web ports, and only with the
      # token. Traffic through it does not go through the VPN — an artwork URL
      # names something in the library, so keep the list as short as it can be.
      # Unset SAMOPROXY_EGRESS_TOKEN to switch the whole thing off.
      SAMOPROXY_EGRESS_ADDR: "${SAMOPROXY_EGRESS_TOKEN:+0.0.0.0:6768}"
      SAMOPROXY_EGRESS_TOKEN: "${SAMOPROXY_EGRESS_TOKEN:-}"
      SAMOPROXY_EGRESS_ALLOW_HOSTS: "${SAMOPROXY_EGRESS_ALLOW_HOSTS:-cdn-images.dzcdn.net,e-cdns-images.dzcdn.net,cdns-images.dzcdn.net}"
      SAMOPROXY_LOG_LEVEL: "${SAMOPROXY_LOG_LEVEL:-info}"
    volumes:
      # Transcodes survive restarts. Losing this is not data loss — it just
      # means the next play of each track re-encodes.
      - transcode-cache:/var/cache/samo-proxy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: samo-cloudflared
    restart: unless-stopped
    # This is a LOCALLY-MANAGED tunnel: a config file plus a credentials JSON,
    # not a dashboard token. That is what was already running on the samo box,
    # and reusing it means the tunnel UUID, the DNS records and every public
    # hostname carry over untouched — only the machine running the connector
    # moves. A token-based tunnel would have meant recreating all of that.
    network_mode: host
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    # Run as the host user that owns the credentials file.
    #
    # The image defaults to uid 65532, but the credentials arrive from the samo
    # box as mode 600 owned by the deploying user — so the default user cannot
    # read them and the container crash-loops on "permission denied". The
    # alternatives are worse: loosening the file to 644 exposes a secret to
    # every user on a box that also runs Immich and Nextcloud, and chowning it
    # to 65532 would need root, which nothing else in this deploy does.
    #
    # Put the real uid/gid in .env (see docs/DEPLOY.md), so this is correct on
    # a host where the deploying user is not 1000.
    user: "${CLOUDFLARED_UID:-1000}:${CLOUDFLARED_GID:-1000}"
    volumes:
      # Read-only: the connector needs to read its credentials, never write
      # them. The JSON in here is gitignored; docs/DEPLOY.md has how to move it
      # across without it landing on a laptop or in an image layer.
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      samo-proxy:
        condition: service_healthy

volumes:
  transcode-cache:
