# Publishes the container image people actually install from.
#
# A release is not usable until the image below exists: installing is
# `docker compose pull`, and there is nothing else to install from.
#
# Fires on a version tag. workflow_dispatch is there to (re)build an image for a
# tag that already exists, which is how v1.0.0 got its first image.
name: Publish container image

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            ref:
                description: Tag to build an image for
                required: true
                default: v1.0.0

jobs:
    image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out the tag being released
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}

            - name: Work out the version to tag the image with
              id: version
              run: echo "value=${{ github.event.inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3

            - name: Log in to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # arm64 builds under emulation here — the Dockerfile's build stage is
            # a plain `FROM golang:1.26-alpine` with no BUILDPLATFORM split. It is
            # a small CGO-free binary, so the emulated compile is tolerable.
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
                      ghcr.io/${{ github.repository }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # The compose file goes to the same registry as the image, as an OCI
            # artifact, so the documented install is one command with nothing to
            # fetch or edit:
            #
            #   docker compose -f oci://ghcr.io/bouliehaan/samo-proxy:compose up -d
            #
            # --resolve-image-digests pins the reference inside the artifact to
            # the image built immediately above.
            # `docker compose publish` needs a recent Compose plugin, and the
            # runner image's is not guaranteed to be new enough. Install a
            # pinned one rather than hoping — a release that fails here has
            # already pushed the image, so the two halves would be out of step.
            - name: Install a Compose that can publish
              run: |
                  mkdir -p ~/.docker/cli-plugins
                  curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
                      https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64
                  chmod +x ~/.docker/cli-plugins/docker-compose
                  docker compose version
                  docker compose publish --help >/dev/null

            - name: Publish the compose artifact
              run: |
                  docker compose -f docker-compose.yml publish --yes \
                      --resolve-image-digests \
                      "ghcr.io/${{ github.repository }}:compose-${{ steps.version.outputs.value }}"
                  docker compose -f docker-compose.yml publish --yes \
                      --resolve-image-digests \
                      "ghcr.io/${{ github.repository }}:compose"

            - name: Check the published artifact resolves and has no relative binds
              run: |
                  set -euo pipefail
                  ref="oci://ghcr.io/${{ github.repository }}:compose"

                  docker compose -f "$ref" config >/dev/null
                  echo "$ref resolves"

                  # A relative bind in a file pulled with -f oci:// resolves
                  # against Compose's own cache directory, not the directory the
                  # install was run from. It fails silently: the container comes
                  # up with an empty mount instead of your tunnel credentials.
                  #
                  # Parsed rather than grepped, because a named volume's source
                  # is a bare name and looks exactly like a relative path.
                  docker compose -f "$ref" config --format json > /tmp/resolved.json
                  python3 - <<'CHECK'
                  import json, sys
                  services = json.load(open("/tmp/resolved.json"))["services"]
                  bad = [
                      f"{name}: {mount.get('source')}"
                      for name, spec in services.items()
                      for mount in spec.get("volumes", [])
                      if mount.get("type") == "bind"
                      and not str(mount.get("source", "")).startswith("/")
                  ]
                  if bad:
                      print("relative bind mounts in the published artifact:", *bad, sep="\n  ")
                      print("under oci:// those mount Compose's cache dir, not the user's files")
                      sys.exit(1)
                  print("every bind mount is absolute")
                  CHECK
